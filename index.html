<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小飞拓客 微信：jz：jzctmqx</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
        .container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 12px; opacity: 0.9; }

        .nav-tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 70px;
            z-index: 99;
        }
        .nav-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: "";
            width: 4px;
            height: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-group { margin-bottom: 15px; }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: #fafafa;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        .form-input[readonly] { background: #f0f0f0; color: #666; }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-success { background: #52c41a; color: white; }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-warning { background: #faad14; color: white; }
        .btn-info { background: #1890ff; color: white; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-row .btn { margin-bottom: 0; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
        }
        .checkbox-group label { font-size: 13px; color: #555; }

        .stat-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 11px; opacity: 0.9; margin-top: 4px; }

        .table-container {
            overflow-x: auto;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th {
            background: #f8f9fa;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: #fafafa; }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 10px;
            font-family: "Courier New", monospace;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .log-line { margin-bottom: 4px; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-title { font-size: 18px; font-weight: bold; }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .keyword-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .keyword-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .keyword-item:hover { background: #f5f5f5; }
        .keyword-item.selected { background: #e6f7ff; color: #1890ff; }

        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success { background: #52c41a; }
        .toast.error { background: #ff4d4f; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .status-badge.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state svg { width: 60px; height: 60px; margin-bottom: 15px; opacity: 0.3; }

        @media (max-width: 380px) {
            .stat-bar { grid-template-columns: repeat(2, 1fr); }
            .btn-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>小飞拓客&nbsp;</h1>
            <p>微信：jzctmqx</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('auth')">授权</button>
            <button class="nav-tab" onclick="switchTab('config')">配置</button>
            <button class="nav-tab" onclick="switchTab('collect')">采集</button>
        </div>

        <!-- 授权页面 -->
        <div id="tab-auth" class="tab-content active">
            <div class="card">
                <div class="card-title">使用说明</div>
                <p style="font-size: 13px; color: #555; line-height: 1.8;">
                    1. 复制下方「机器码」<br>
                    2. 将机器码发送给管理员(微信：jzctmqx)<br>
                    3. 管理员会回复对应的「激活码」<br>
                    4. 在下方「授权校验」粘贴激活码并校验<br>
                    5. 通过后即可使用采集工具
                </p>
            </div>

            <div class="card">
                <div class="card-title">机器码</div>
                <div class="form-group">
                    <input type="text" class="form-input" id="machine-code" readonly>
                </div>
                <button class="btn btn-primary" onclick="copyMachineCode()">复制机器码</button>
            </div>

            <div class="card">
                <div class="card-title">授权校验</div>
                <div class="form-group">
                    <label class="form-label">激活码</label>
                    <input type="text" class="form-input" id="auth-code" placeholder="请输入激活码">
                </div>
                <div id="auth-status" style="margin-bottom: 15px;"></div>
                <button class="btn btn-primary" onclick="verifyAuth()">校验授权</button>
            </div>
        </div>

        <!-- 配置页面 -->
        <div id="tab-config" class="tab-content">
            <div class="card">
                <div class="card-title">采集参数</div>
                <div class="form-group">
                    <label class="form-label">采集城市</label>
                    <input type="text" class="form-input" id="cfg-city" placeholder="如: 北京">
                </div>
                <div class="form-group">
                    <label class="form-label">行业关键词</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" class="form-input" id="cfg-keyword" placeholder="如: 餐饮,火锅" style="flex: 1;">
                        <button class="btn btn-info" onclick="openKeywordModal()" style="width: auto; padding: 12px 20px;">搜索</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">采集页数 (默认5)</label>
                    <input type="number" class="form-input" id="cfg-page" value="5" min="1" max="25">
                </div>
                <div class="form-group">
                    <label class="form-label">请求间隔 (秒)</label>
                    <input type="number" class="form-input" id="cfg-delay" value="0.8" step="0.1">
                </div>
            </div>

            <div class="card">
                <div class="card-title">过滤选项</div>
                <div class="checkbox-group">
                    <input type="checkbox" id="cfg-only-tel">
                    <label for="cfg-only-tel">只采集有电话的商户</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="cfg-filter-hotline">
                    <label for="cfg-filter-hotline">过滤400/座机号码</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="cfg-download-img">
                    <label for="cfg-download-img">下载门头照</label>
                </div>
            </div>

            <div class="card">
                <div class="card-title">代理设置</div>
                <div class="checkbox-group">
                    <input type="checkbox" id="cfg-use-proxy">
                    <label for="cfg-use-proxy">使用代理</label>
                </div>
                <div class="form-group">
                    <input type="text" class="form-input" id="cfg-proxy" placeholder="如: http://127.0.0.1:8888">
                </div>
            </div>

            <div class="card">
                <div class="card-title">导出格式</div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btn-excel" onclick="setExportType('excel')">Excel</button>
                    <button class="btn" id="btn-csv" onclick="setExportType('csv')" style="background: #f0f0f0; color: #333;">CSV</button>
                </div>
                <button class="btn" id="btn-txt" onclick="setExportType('txt')" style="background: #f0f0f0; color: #333;">TXT</button>
                <button class="btn btn-success" onclick="saveConfig()">保存配置</button>
            </div>
        </div>

        <!-- 采集页面 -->
        <div id="tab-collect" class="tab-content">
            <div class="stat-bar">
                <div class="stat-item">
                    <div class="stat-value" id="stat-current">0</div>
                    <div class="stat-label">当前条数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-history">0</div>
                    <div class="stat-label">历史条数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-skip">0</div>
                    <div class="stat-label">跳过重复</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-notel">0</div>
                    <div class="stat-label">无电话</div>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-success" id="btn-start" onclick="startCollect()">开始采集</button>
                <button class="btn btn-danger" id="btn-stop" onclick="stopCollect()">停止采集</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-warning" onclick="clearData()">清空数据</button>
                <button class="btn btn-info" onclick="exportData()">导出数据</button>
            </div>

            <div class="card">
                <div class="card-title">采集结果</div>
                <div class="table-container" id="data-table">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        <p>暂无数据</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">采集日志</div>
                <div class="log-container" id="log-container">
                    <div class="log-line">等待采集...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 关键词搜索弹窗 -->
    <div class="modal" id="keyword-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">行业关键词搜索</div>
                <button class="modal-close" onclick="closeKeywordModal()">&times;</button>
            </div>
            <div class="form-group">
                <input type="text" class="form-input" id="keyword-search" placeholder="输入关键词搜索" oninput="searchKeyword()">
            </div>
            <div class="keyword-list" id="keyword-list"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-success" onclick="appendKeyword()">追加</button>
                <button class="btn btn-primary" onclick="replaceKeyword()">替换</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentTab = 'auth';
        let selectedKeyword = '';
        let exportType = 'excel';
        let refreshInterval = null;

        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');

            if (tab === 'collect') {
                startRefresh();
            } else {
                stopRefresh();
            }
        }

        // 显示提示
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 获取机器码
        async function loadMachineCode() {
            try {
                const res = await fetch('/api/machine_code');
                const data = await res.json();
                document.getElementById('machine-code').value = data.machine_code;
            } catch (e) {
                console.error(e);
            }
        }

        // 复制机器码
        function copyMachineCode() {
            const code = document.getElementById('machine-code');
            code.select();
            document.execCommand('copy');
            showToast('机器码已复制');
        }

        // 校验授权
        async function verifyAuth() {
            const code = document.getElementById('auth-code').value.trim();
            if (!code) {
                showToast('请输入激活码', 'error');
                return;
            }
            try {
                const res = await fetch('/api/verify_auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auth_code: code })
                });
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('auth-status').innerHTML = '<span class="status-badge success">授权已通过</span>';
                    showToast(data.msg);
                } else {
                    document.getElementById('auth-status').innerHTML = '<span class="status-badge error">授权失败</span>';
                    showToast(data.msg, 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // 检查授权状态
        async function checkAuth() {
            try {
                const res = await fetch('/api/check_auth');
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('auth-status').innerHTML = '<span class="status-badge success">授权已通过</span>';
                }
            } catch (e) {}
        }

        // 加载配置
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                document.getElementById('cfg-city').value = cfg.city || '';
                document.getElementById('cfg-keyword').value = cfg.keyword || '';
                document.getElementById('cfg-page').value = cfg.max_page || '5';
                document.getElementById('cfg-delay').value = cfg.delay || '0.8';
                document.getElementById('cfg-only-tel').checked = cfg.only_tel || false;
                document.getElementById('cfg-filter-hotline').checked = cfg.filter_hotline || false;
                document.getElementById('cfg-download-img').checked = cfg.download_img || false;
                document.getElementById('cfg-use-proxy').checked = cfg.use_proxy || false;
                document.getElementById('cfg-proxy').value = cfg.proxy_addr || '';
                setExportType(cfg.export_type || 'excel');
            } catch (e) {
                console.error(e);
            }
        }

        // 保存配置
        async function saveConfig() {
            const cfg = {
                city: document.getElementById('cfg-city').value,
                keyword: document.getElementById('cfg-keyword').value,
                max_page: document.getElementById('cfg-page').value,
                delay: document.getElementById('cfg-delay').value,
                only_tel: document.getElementById('cfg-only-tel').checked,
                filter_hotline: document.getElementById('cfg-filter-hotline').checked,
                download_img: document.getElementById('cfg-download-img').checked,
                use_proxy: document.getElementById('cfg-use-proxy').checked,
                proxy_addr: document.getElementById('cfg-proxy').value,
                export_type: exportType
            };
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cfg)
                });
                const data = await res.json();
                showToast(data.msg);
            } catch (e) {
                showToast('保存失败', 'error');
            }
        }

        // 设置导出格式
        function setExportType(type) {
            exportType = type;
            document.getElementById('btn-excel').style.background = type === 'excel' ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f0f0f0';
            document.getElementById('btn-excel').style.color = type === 'excel' ? 'white' : '#333';
            document.getElementById('btn-csv').style.background = type === 'csv' ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f0f0f0';
            document.getElementById('btn-csv').style.color = type === 'csv' ? 'white' : '#333';
            document.getElementById('btn-txt').style.background = type === 'txt' ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f0f0f0';
            document.getElementById('btn-txt').style.color = type === 'txt' ? 'white' : '#333';
        }

        // 打开关键词弹窗
        async function openKeywordModal() {
            document.getElementById('keyword-modal').classList.add('active');
            await searchKeyword();
        }

        // 关闭关键词弹窗
        function closeKeywordModal() {
            document.getElementById('keyword-modal').classList.remove('active');
        }

        // 搜索关键词
        async function searchKeyword() {
            const q = document.getElementById('keyword-search').value;
            try {
                const res = await fetch('/api/keywords?q=' + encodeURIComponent(q));
                const keywords = await res.json();
                const list = document.getElementById('keyword-list');
                list.innerHTML = keywords.map(kw =>
                    `<div class="keyword-item" onclick="selectKeyword(this, '${kw}')">${kw}</div>`
                ).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // 选择关键词
        function selectKeyword(el, kw) {
            document.querySelectorAll('.keyword-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedKeyword = kw;
        }

        // 追加关键词
        function appendKeyword() {
            if (!selectedKeyword) return;
            const current = document.getElementById('cfg-keyword').value.trim();
            if (current) {
                if (!current.split(',').includes(selectedKeyword)) {
                    document.getElementById('cfg-keyword').value = current + ',' + selectedKeyword;
                }
            } else {
                document.getElementById('cfg-keyword').value = selectedKeyword;
            }
            closeKeywordModal();
            showToast('已追加');
        }

        // 替换关键词
        function replaceKeyword() {
            if (!selectedKeyword) return;
            document.getElementById('cfg-keyword').value = selectedKeyword;
            closeKeywordModal();
            showToast('已替换');
        }

        // 开始采集
        async function startCollect() {
            try {
                const res = await fetch('/api/start_collect', { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.msg);
                    document.getElementById('btn-start').style.opacity = '0.5';
                    document.getElementById('btn-start').disabled = true;
                } else {
                    showToast(data.msg, 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // 停止采集
        async function stopCollect() {
            try {
                await fetch('/api/stop_collect');
                showToast('已停止采集');
                document.getElementById('btn-start').style.opacity = '1';
                document.getElementById('btn-start').disabled = false;
            } catch (e) {}
        }

        // 清空数据
        async function clearData() {
            try {
                await fetch('/api/clear_data');
                showToast('数据已清空');
                updateTable([]);
            } catch (e) {}
        }

        // 导出数据
        function exportData() {
            window.location.href = '/api/export';
        }

        // 更新表格
        function updateTable(data) {
            const container = document.getElementById('data-table');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        <p>暂无数据</p>
                    </div>`;
                return;
            }

            let html = '<table><thead><tr>';
            ['序号', '商家名称', '详细地址', '联系电话', '经度', '纬度'].forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '</tr></thead><tbody>';

            data.forEach(row => {
                html += `<tr>
                    <td>${row.idx}</td>
                    <td>${row.name}</td>
                    <td>${row.address}</td>
                    <td>${row.phone}</td>
                    <td>${row.lng}</td>
                    <td>${row.lat}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 更新统计
        function updateStat(stat) {
            document.getElementById('stat-current').textContent = stat.current;
            document.getElementById('stat-history').textContent = stat.history;
            document.getElementById('stat-skip').textContent = stat.skip_repeat;
            document.getElementById('stat-notel').textContent = stat.no_tel;
        }

        // 更新日志
        function updateLogs(logs) {
            const container = document.getElementById('log-container');
            container.innerHTML = logs.map(l => `<div class="log-line">${l}</div>`).join('');
            container.scrollTop = container.scrollHeight;
        }

        // 刷新数据
        async function refreshData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                updateStat(data.stat);
                updateTable(data.data);
                updateLogs(data.logs);

                if (data.running) {
                    document.getElementById('btn-start').style.opacity = '0.5';
                    document.getElementById('btn-start').disabled = true;
                } else {
                    document.getElementById('btn-start').style.opacity = '1';
                    document.getElementById('btn-start').disabled = false;
                }
            } catch (e) {}
        }

        // 定时刷新
        function startRefresh() {
            refreshData();
            refreshInterval = setInterval(refreshData, 1000);
        }

        function stopRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadMachineCode();
            checkAuth();
            loadConfig();
        });
    </script>
</body>
</html>
